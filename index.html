<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FND Companion</title>
<meta name="theme-color" content="#2f6f6a">
<meta name="description" content="Gentle, sourced self-management exercises and a private symptom log for Functional Neurological Disorder.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FND Companion">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#22302f;--muted:#5b6866;--brand:#2f6f6a;--brand2:#e7f1ef;--warm:#f2c48d;--warm2:#fbefe0;--line:#e3ddd2;--danger:#9b3b2f}
@media (prefers-color-scheme:dark){:root{--bg:#141a19;--card:#1d2523;--ink:#eef2f0;--muted:#a9b6b3;--brand:#7cc2b9;--brand2:#22322f;--warm:#e9b47a;--warm2:#3a2f22;--line:#2e3a37;--danger:#f0a090}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:var(--brand)}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;font-weight:700;flex:1}
.back{background:none;border:0;color:var(--brand);font-size:18px;min-height:48px;padding:0 6px;font-weight:600}
main{padding:4px 16px 24px;max-width:640px;margin:0 auto}
h2{font-size:22px;margin:18px 0 8px}
h3{font-size:18px;margin:16px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;border:0;background:var(--brand);color:#fff;font-size:19px;font-weight:650;padding:12px 16px;cursor:pointer;text-decoration:none}
@media (prefers-color-scheme:dark){.btn{color:#0f1817}}
.btn.alt{background:var(--brand2);color:var(--ink)}
.btn.warm{background:var(--warm);color:#2b1d0d}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}
.sos{background:var(--warm);color:#2b1d0d;border-radius:22px;padding:18px;display:block;width:100%;border:0;text-align:left;font:inherit;cursor:pointer;margin:8px 0}
.sos b{font-size:22px;display:block}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;font:inherit;color:inherit;cursor:pointer;min-height:64px}
.tile.big{border:2px solid var(--brand);padding:20px 16px}
.tile .ic{font-size:30px;width:44px;text-align:center}
.tile .t{font-weight:700;font-size:19px}
.tile .d{color:var(--muted);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .tile{margin:0;flex-direction:column;align-items:flex-start;gap:4px}
.grid2 .tile .ic{width:auto;font-size:26px}
.grid2 .tile .t{font-size:16px}
.ex{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:8px 0;font:inherit;color:inherit;min-height:60px;cursor:pointer}
.ex .t{flex:1;font-weight:600}
.pill{font-size:13px;background:var(--brand2);border-radius:99px;padding:3px 10px;color:var(--ink);white-space:nowrap}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:8px 0}
ol.steps li{counter-increment:s;position:relative;padding:10px 0 10px 48px;border-bottom:1px solid var(--line);font-size:19px}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:34px;height:34px;border-radius:50%;background:var(--brand2);display:flex;align-items:center;justify-content:center;font-weight:700}
.tip{background:var(--warm2);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:16px}
.src{font-size:14px;color:var(--muted)}
.src a{word-break:break-word}
.timer{text-align:center}
.timer .clock{font-size:52px;font-variant-numeric:tabular-nums;font-weight:700;margin:6px 0}
.breath{width:160px;height:160px;border-radius:50%;margin:10px auto;background:radial-gradient(circle,var(--brand2),var(--brand));transform:scale(.55);transition:transform 5s ease-in-out;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.breath.in{transform:scale(1)}
.fav{background:none;border:2px solid var(--line);border-radius:14px;min-height:48px;min-width:48px;font-size:22px;cursor:pointer;color:var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;background:none;border:0;min-height:64px;font:inherit;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav.tabs button span{font-size:22px}
nav.tabs button.on{color:var(--brand);font-weight:700}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:48px;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.seg button.on{border-color:var(--brand);background:var(--brand2)}
input,select,textarea{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:52px}
textarea{min-height:90px}
label{display:block;font-weight:650;margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:15px;min-height:42px;cursor:pointer}
.log-item{border-bottom:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:flex-start}
.log-item .t{flex:1}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted)}
.bars .stack{width:100%;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;min-height:2px;background:var(--line)}
.bars .tr{background:var(--brand)}.bars .sz{background:var(--warm)}
.legend{display:flex;gap:14px;font-size:14px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:16px;z-index:9;max-width:90%;text-align:center}
.sosmode{text-align:center}
.sosmode .big{font-size:28px;line-height:1.35;font-weight:650;min-height:180px;display:flex;align-items:center;justify-content:center;padding:10px}
.private{display:flex;gap:8px;align-items:center;background:var(--brand2);border-radius:12px;padding:10px 12px;font-size:15px}
.disc{font-size:15px;color:var(--muted)}
button:focus-visible,a:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.breath{transition:none}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-go="#/" id="t-home"><span>🏠</span>Home</button>
  <button data-go="#/log" id="t-log"><span>📝</span>Log</button>
  <button data-go="#/saved" id="t-saved"><span>⭐</span>Saved</button>
  <button data-go="#/about" id="t-about"><span>ℹ️</span>About</button>
</nav>
<script>
const SRC = {
  seiz: ['neurosymptoms.org – Treatment of functional seizures', 'https://neurosymptoms.org/en/treatment/treatment-of-functional-seizures/'],
  trem: ['neurosymptoms.org – Treatment of tremor/movement problems', 'https://neurosymptoms.org/en/treatment/treatment-of-tremor-spasms/'],
  limb: ['neurosymptoms.org – Treatment of limb weakness', 'https://neurosymptoms.org/en/treatment/treatment-of-limb-weakness/'],
  gait: ['neurosymptoms.org – Functional gait disorder', 'https://neurosymptoms.org/en/symptoms/fnd-symptoms/functional-gait-disorder/'],
  phys: ['neurosymptoms.org – Physiotherapy / Activity', 'https://neurosymptoms.org/en/treatment/physiotherapy-exercise/'],
  cog: ['neurosymptoms.org – Functional cognitive symptoms', 'https://neurosymptoms.org/en/symptoms/fnd-symptoms/functional-cognitive-symptoms/'],
  sleep: ['neurosymptoms.org – Sleep problems', 'https://neurosymptoms.org/en/symptoms/common-associated-symptoms/sleep-problems/'],
  diss: ['neurosymptoms.org – Dissociative symptoms', 'https://neurosymptoms.org/en/symptoms/common-associated-symptoms/dissociative-symptoms/'],
  niel: ['Nielsen et al. 2015, Physiotherapy for functional motor disorders: a consensus recommendation (J Neurol Neurosurg Psychiatry)', 'https://pmc.ncbi.nlm.nih.gov/articles/PMC4602268/'],
  nhsb: ['NHS – Breathing exercises for stress', 'https://www.nhs.uk/mental-health/self-help/guides-tools-and-activities/breathing-exercises-for-stress/'],
  nhsg: ['NHS inform – Grounding exercises', 'https://www.nhsinform.scot/healthy-living/mental-wellbeing/breathing-and-relaxation-exercises/grounding-exercises/'],
  hope: ['FND Hope – Patient booklet (grounding techniques)', 'https://www.fndhope.org/wp-content/uploads/2023/04/Final-Print-FND-Hope-Patient-Booklet.pdf'],
  act: ['FND Action – Functional seizures', 'https://www.fndaction.org.uk/functional-seizures/']
};

const CATS = [
  {id:'tremor', name:'Tremor & shaking', icon:'〰️', primary:true, blurb:'Ways to break the rhythm of the tremor, relax your muscles and help your body become still.'},
  {id:'seizure', name:'Seizure warning signs', icon:'🛟', primary:true, blurb:'What to do when you notice warning signs that a seizure may start – grounding, breathing, distraction.'},
  {id:'gait', name:'Walking & balance', icon:'🚶', blurb:'Exercises to help walking feel automatic again (so you do not have to think about each step).'},
  {id:'weakness', name:'Limb weakness', icon:'💪', blurb:'Exercises to help a weak arm or leg move naturally again.'},
  {id:'fatigue', name:'Fatigue', icon:'🔋', blurb:'Pacing: doing a steady amount each day, instead of doing too much on good days and then being exhausted afterwards.'},
  {id:'fog', name:'Concentration & memory', icon:'☁️', blurb:'Help with attention, sleep, and feeling more confident about your memory (sometimes called brain fog).'}
];

// mins = suggested timer length (0 = no timer)
const EX = [
  // ---------- TREMOR ----------
  {id:'conductor', cats:['tremor'], title:'Big, slow arm movements', old:'Conduct the orchestra', mins:2, src:['trem','niel'],
   why:'Making a big, deliberate movement at the same time as the tremor can replace the rhythm of the tremor.',
   steps:['Sit or stand somewhere comfortable.','With the shaking arm, move your whole arm through the air in big, sweeping movements (like a music conductor waving their arm).','Gradually make the movements wider and slower.','Keep slowing down until you bring the arm to a gentle standstill.','Notice: did the tremor stop, even for a moment? If it did, your brain is learning to control the movement again.'],
   tip:'It may feel strange or not work at first. These skills take repeated practice – that\u2019s normal.'},
  {id:'rhythm', cats:['tremor'], title:'Copy a changing rhythm', mins:2, src:['trem','niel'],
   why:'Copying a different rhythm with your other hand can change or stop the rhythm of the tremor. This is called entrainment.',
   steps:['Ask a friend to tap a steady rhythm on a table (or use music with a clear beat).','Copy the tapping with your unaffected hand or foot.','Your friend speeds up and slows down – keep copying.','If the tremor changes with the rhythm, slow the rhythm right down, and see if the tremor slows or stops with it.'],
   tip:'Alone? Try finger-to-thumb tapping on your other hand at different speeds.'},
  {id:'pmr', cats:['tremor','fatigue','seizure'], title:'Tense and release (muscle relaxation)', mins:5, src:['trem','niel'],
   why:'Functional tremor often comes from tensing many muscles at once. Learning to contract and then relax helps you regain control.',
   steps:['Get comfortable, sitting or lying.','Make a fist and tense your forearm for about 5 seconds.','Relax those muscles completely. For 10 seconds, notice how relaxed feels different from tense.','Move on: upper arm, shoulders, face, then legs and feet.','Finish with a few slow breaths.'],
   tip:'Tense gently – it should never hurt.'},
  {id:'weightshift-still', cats:['tremor','gait'], title:'Sway to stillness', mins:2, src:['niel'],
   why:'The physio consensus suggests slow weight shifting, then gradually shifting to stillness, for tremor in standing or the legs.',
   steps:['Stand with feet hip-width apart, holding a table or counter if you need to.','Shift your weight slowly from side to side.','Then try forward and back.','As the shaking gets less, make the movements smaller and slower…','…until you come to rest, evenly balanced on both feet.'],
   tip:'Stand near something sturdy. Stop and sit if you feel unsteady.'},
  {id:'mirror', cats:['tremor','weakness'], title:'Mirror practice', mins:3, src:['trem','niel'],
   why:'Watching yourself in a mirror gives your brain feedback about where things are going wrong, and can take attention off body sensations.',
   steps:['Sit or stand in front of a mirror.','Look at the affected arm or leg in the mirror (not directly).','Practise slowly bringing it to a normal, relaxed position.','Try simple movements – reaching, opening the hand, standing evenly – while watching the mirror.'],
   tip:'Short, regular sessions are better than one long one.'},
  {id:'even-stand', cats:['tremor','gait'], title:'Even standing check', mins:1, src:['niel'],
   why:'Spreading weight evenly through both feet supports more normal posture and can settle leg tremor.',
   steps:['Stand with feet hip-width apart, near support.','Notice which foot carries more weight.','Slowly move your weight until both feet carry the same amount (if you stood on two bathroom scales, they would show the same number).','Use a mirror if helpful.','Hold for a few relaxed breaths.'],
   tip:'You can practise this by standing on two bathroom scales, one under each foot.'},
  {id:'busy-not-resting', cats:['tremor','seizure'], title:'Do an activity instead of sitting and watching your symptoms', old:'Swap “resting and noticing” for doing', mins:0, src:['trem','seiz'],
   why:'Tremor and attacks are often worse when sitting still and paying attention to your body. A light, absorbing task gives the brain something else to do.',
   steps:['Notice when you are sitting or lying still and checking your body for symptoms.','Pick something absorbing: a phone game, a puzzle, a podcast, folding laundry, chatting.','Give it your attention for a few minutes.','Notice how symptoms change when your attention is elsewhere.'],
   tip:'This does not mean ignoring your symptoms all the time. It means spending a few minutes not checking for symptoms.'},
  {id:'tremor-episodes', cats:['tremor'], title:'If your tremor comes and goes in episodes', old:'If tremor comes in “bouts”', mins:0, src:['trem','seiz'],
   why:'Some people have tremor episodes that start with feeling detached or unreal (dissociation). The same warning-sign skills used for seizures can help.',
   steps:['Start noticing what happens just before an episode: do you feel detached or unreal, tense, dizzy, or hot?','When you notice it, use a grounding exercise (5-4-3-2-1) or hard counting.','Log it in the tracker afterwards – patterns help you and your doctor.'],
   tip:'Talk this through with your neurologist or physio – it\u2019s useful information for them.'},
  {id:'jerks', cats:['tremor'], title:'Jerks: notice the feeling just before a jerk', old:'Jerks: catch the “build-up” feeling', mins:0, src:['niel'],
   why:'For sudden jerks, the consensus advice is to notice the feeling just before a jerk (or noticing that you are focusing on one part of your body), and then move your attention to something else.',
   steps:['Notice what happens just before a jerk – an urge, tension, focusing on a body part?','When you notice it, move your attention to things outside your body: name things you can see, start a task, or talk to someone.','Gently release any tension in the area.'],
   tip:''},

  // ---------- SEIZURE ----------
  {id:'g54321', cats:['seizure','fog'], title:'5-4-3-2-1 grounding', mins:2, src:['nhsg','hope'],
   why:'Grounding uses your senses (seeing, hearing, touch, smell, taste) to bring your attention to what is around you right now. It can help when you feel detached or unreal, or feel that a seizure may start.',
   steps:['Take one slow breath.','Name 5 things you can SEE.','Name 4 things you can FEEL (feet on the floor, your clothes…).','Name 3 things you can HEAR.','Name 2 things you can SMELL.','Name 1 thing you can TASTE.'],
   tip:'Practise when you feel calm, so it comes easily when you need it (FND Hope).'},
  {id:'count7', cats:['seizure'], title:'Hard counting', mins:1, src:['seiz','hope'],
   why:'A task that takes real effort can help you pay less attention to the warning feelings.',
   steps:['Count backwards from 100 in sevens: 100, 93, 86, 79…','Too hard right now? Try fours (100, 96, 92…) or threes.','Or say the alphabet backwards.','Keep going until the warning feeling goes away.'],
   tip:'It needs to be quite difficult to work as a distraction.'},
  {id:'calm-breath', cats:['seizure','fatigue','tremor'], title:'Calm belly breathing', mins:5, src:['nhsb','act','seiz'],
   why:'Fast, shallow breathing (hyperventilation) can make warning symptoms stronger. Slow belly breathing helps your body\u2019s stress response calm down.',
   steps:['Sit with your back supported, feet flat.','Breathe so that your belly moves out when you breathe in. Do not force it.','Breathe in gently through your nose, counting 1 to 5.','Breathe out gently through your mouth, counting 1 to 5.','Keep going for a few minutes. Follow the circle below.'],
   tip:'You may not reach 5 at first – that\u2019s fine.', breath:true},
  {id:'sensory-kit', cats:['seizure'], title:'Strong sensation grounding', mins:0, src:['hope'],
   why:'A strong, clear feeling (cold, sour, a strong smell) can help you notice your body and your surroundings again.',
   steps:['Grip something cold (ice cube, cold can).','Bite into something sour (a sour sweet, lemon).','Smell something strong (essential oil, coffee).','Run cool water over your hands, or put a cool cloth on your face.','Squeeze your fist tightly, then release. Repeat.'],
   tip:'Keep a small grounding kit in your bag: a sour sweet, a smooth stone, a scent.'},
  {id:'distract', cats:['seizure'], title:'Talk, sing, play', mins:0, src:['seiz'],
   why:'In the few seconds before an attack, focusing on something else can help you stay in control.',
   steps:['Talk to someone nearby – about anything.','Sing a favourite song (out loud or in your head).','Play a game on your phone.','Pick up a magazine and start reading.'],
   tip:''},
  {id:'thoughts', cats:['seizure'], title:'Answer the scary thoughts', mins:0, src:['seiz'],
   why:'Frightening thoughts during warning signs make the body\u2019s "fight or flight" stress response stronger. Knowing the answers to these thoughts can help you feel less afraid.',
   steps:['"Am I losing my mind?" – No. You are losing control of your body for a short time. You are not going mad.','"Is this epilepsy?" – No. If unsure why not, ask your doctor.','"Might I die?" – No, this has never happened.','"Will it be embarrassing?" – Perhaps a bit, but it is not worth giving up the things you love.','Say to yourself: "This is the warning feeling. My nervous system is reacting as if there is danger. It will stop."'],
   tip:'Fewer, less alarming warnings – or longer warnings – are signs of progress.'},
  {id:'warning-map', cats:['seizure'], title:'Learn your warning signs', mins:0, src:['seiz','diss'],
   why:'Most people get some warning before at least some attacks. Learning to notice the warning is an important step in learning to control attacks.',
   steps:['Common warning signs: racing heart, chest tightness, short of breath, sweating, tingling, dizziness, hot or cold, feeling detached or unreal, feeling of losing control.','After an attack, write down what you noticed beforehand (the tracker\u2019s "trigger" field works well).','Ask people close to you what they notice – they sometimes see a warning you don\u2019t remember.','Notice situations: resting doing nothing, crowds, upsetting memories, medical appointments.'],
   tip:'Feeling detached or unreal (dissociation) is common and not dangerous, though it feels scary.'},

  // ---------- GAIT ----------
  {id:'rhythm-walk', cats:['gait','weakness'], title:'Walk to a beat', mins:3, src:['gait','niel'],
   why:'Rhythm and music help walking become automatic instead of effortful.',
   steps:['Put on music with a steady beat – or hum a tune.','Walk in time to the beat.','Or count: "1, 2, 1, 2…"','Notice whether walking feels easier.'],
   tip:'Walk somewhere safe and clear, with support nearby if you need it.'},
  {id:'backwards', cats:['gait'], title:'Walk backwards or sideways', mins:2, src:['gait','niel'],
   why:'The brain controls walking backwards differently from walking forwards, so it is often easier. It can help you feel what automatic movement is like.',
   steps:['Choose a clear hallway, ideally with a wall or rail to touch.','Take a few slow steps backwards.','Try sideways steps too.','Then turn and try a few steps forwards, keeping the same relaxed feeling.'],
   tip:'Have someone with you the first few times. Only do this as practice in a safe place, not as your normal way of walking.'},
  {id:'start-shift', cats:['gait'], title:'Can\u2019t start walking? Shift your weight first', old:'Stuck? Shift, then go', mins:0, src:['gait','niel'],
   why:'If you cannot start walking, moving your weight from side to side a few times often helps you take the first step.',
   steps:['Stand still with support nearby.','Shift your weight from side to side for a few seconds.','Let your feet "automatically" move forward a little with each shift.','Gradually lengthen the steps into walking.'],
   tip:''},
  {id:'skate', cats:['gait'], title:'Sliding steps (like ice skating)', old:'Ice-skater slide', mins:2, src:['gait','niel'],
   why:'Sliding the feet keeps them in contact with the floor and can make walking feel smoother.',
   steps:['On a smooth floor in socks (carefully!), stand near support.','Slide one foot forward along the floor, keeping it touching the floor the whole time.','Then the other.','Notice if walking feels more natural afterwards.'],
   tip:'Only on a safe, clear surface.'},
  {id:'ball', cats:['gait','weakness'], title:'Balloon or ball play', mins:3, src:['trem','phys'],
   why:'Paying attention to a ball or balloon takes your attention away from your legs, so they can move more automatically.',
   steps:['Gently bounce a balloon up and keep it in the air, or kick a soft ball.','Keep your eyes on the ball, not your body.','Try to enjoy it – the aim is to play, not to exercise.'],
   tip:''},
  {id:'dance', cats:['gait','tremor'], title:'Bring back a movement you love', mins:3, src:['gait','trem'],
   why:'Movements you learned and enjoyed before (dance, sport) can help your brain find natural movement again.',
   steps:['Think of a movement you enjoyed: dancing, a sport, swimming strokes…','Practise a little of it, on your own or with someone you trust.','Try to bring that natural feeling into your normal walk.'],
   tip:'You might feel a bit silly – that\u2019s OK!'},

  // ---------- WEAKNESS ----------
  {id:'both-sides', cats:['weakness'], title:'Move both sides together', mins:3, src:['limb','niel'],
   why:'Automatic movements using both arms or both legs together tend to work better than straining with the weak limb alone.',
   steps:['Choose a two-sided movement: clapping, folding a towel, pedalling while seated, catching a ball with two hands.','Focus on the task, not the weak limb.','Repeat for a few minutes.'],
   tip:'The harder you try to move a weak limb, the heavier it can feel. Let it move along with the other side without trying hard.'},
  {id:'target', cats:['weakness','gait'], title:'Look at the goal, not the limb', mins:0, src:['phys','niel'],
   why:'Focusing on a target outside your body (a spot ahead, a ball) lets movement happen more automatically.',
   steps:['Pick a target: a spot on the wall ahead, a cup to reach for, a ball to kick.','Keep your eyes and attention on the target.','Move towards it without looking at the limb.'],
   tip:''},
  {id:'hands-weight', cats:['weakness'], title:'Lean through your hands', mins:2, src:['niel'],
   why:'Putting your weight on your hands, then moving it from hand to hand, can make your arm muscles work automatically.',

// ---------- emergency number by country ----------
const EMERG = {
  US:{name:'United States', num:'911'},
  CA:{name:'Canada', num:'911'},
  UK:{name:'United Kingdom', num:'999', alt:'112', note:'112 also works.'},
  IE:{name:'Ireland', num:'112', alt:'999', note:'999 also works.'},
  AU:{name:'Australia', num:'000', alt:'112', note:'112 also works from mobile phones.'},
  NZ:{name:'New Zealand', num:'111'},
  EU:{name:'Europe (EU countries)', num:'112'},
  IN:{name:'India', num:'112'},
  ZA:{name:'South Africa', num:'112', alt:'10177', note:'112 is for mobile phones. 10177 is the ambulance number.'},
  OTHER:{name:'Other – I will type my own number'}
};
const EMERG_UNKNOWN = {name:'Not sure', num:'911', alt:'112', note:'911 is for the US and Canada. 112 works on most mobile phones worldwide.'};
function guessCountry(){
  let tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e){}
  if (/^Australia\//.test(tz)) return 'AU';
  if (/^(Pacific\/Auckland|Pacific\/Chatham|NZ)/.test(tz)) return 'NZ';
  if (tz === 'Europe/London' || tz === 'Europe/Belfast') return 'UK';
  if (tz === 'Europe/Dublin') return 'IE';
  if (/^Asia\/(Kolkata|Calcutta)$/.test(tz)) return 'IN';
  if (tz === 'Africa/Johannesburg') return 'ZA';
  if (/^America\/(Toronto|Vancouver|Edmonton|Winnipeg|Halifax|St_Johns|Regina|Moncton|Montreal|Whitehorse|Yellowknife|Iqaluit|Glace_Bay|Goose_Bay|Swift_Current|Dawson_Creek|Fort_Nelson|Creston|Dawson|Inuvik|Rankin_Inlet|Resolute|Cambridge_Bay|Atikokan|Blanc-Sablon|Nipigon|Thunder_Bay|Rainy_River|Pangnirtung)$/.test(tz) || /^Canada\//.test(tz)) return 'CA';
  if (/^America\/(New_York|Chicago|Denver|Phoenix|Los_Angeles|Anchorage|Juneau|Sitka|Metlakatla|Yakutat|Nome|Adak|Boise|Detroit|Menominee|Indiana\/.+|Kentucky\/.+|North_Dakota\/.+)$/.test(tz) || /^(US\/|Pacific\/Honolulu)/.test(tz)) return 'US';
  const EU_TZ = /^Europe\/(Amsterdam|Athens|Berlin|Bratislava|Brussels|Bucharest|Budapest|Busingen|Copenhagen|Helsinki|Lisbon|Ljubljana|Luxembourg|Madrid|Malta|Mariehamn|Paris|Prague|Riga|Rome|Sofia|Stockholm|Tallinn|Vienna|Vilnius|Warsaw|Zagreb|Nicosia)$|^Asia\/(Nicosia|Famagusta)$|^Atlantic\/(Canary|Madeira|Azores)$/;
  if (EU_TZ.test(tz)) return 'EU';
  const langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']);
  for (const l of langs){
    const r = (String(l).split('-')[1] || '').toUpperCase();
    if (r === 'GB') return 'UK';
    if (['US','CA','IE','AU','NZ','IN','ZA'].includes(r)) return r;
    if (['AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU','IT','LV','LT','LU','MT','NL','PL','PT','RO','SK','SI','ES','SE'].includes(r)) return 'EU';
  }
  return '';
}
// Returns {code, name, num, alt, note, guessed}
function emergency(){
  const saved = LS.get('emergency', null);
  const code = saved ? saved.code : guessCountry();
  if (code === 'OTHER'){
    const n = String(saved && saved.custom || '').replace(/[^\d+*#]/g,'');
    if (n) return {code, name:'Your own number', num:n};
    return Object.assign({code, guessed:false}, EMERG_UNKNOWN);
  }
  const e = EMERG[code];
  return e ? Object.assign({code, guessed:!saved}, e) : Object.assign({code:'', guessed:!saved}, EMERG_UNKNOWN);
}
function emergencyButtons(){
  const e = emergency();
  return `<a class="btn warm" href="tel:${esc(e.num)}">📞 Call ${esc(e.num)}</a>`
    + (e.alt ? `<a class="btn ghost" style="margin-top:10px" href="tel:${esc(e.alt)}">📞 Or call ${esc(e.alt)}</a>` : '')
    + (e.note ? `<p class="muted small" style="margin-top:8px">${esc(e.note)}</p>` : '');
}
function saveEmergency(){
  const code = $('#ecountry').value;
  const custom = $('#ecustom') ? $('#ecustom').value.trim() : '';
  if (code === 'OTHER' && !custom.replace(/[^\d]/g,'')){ about(); toast('Type your emergency number, then tap Save'); return; }
  LS.set('emergency', {code, custom: code === 'OTHER' ? custom : ''});
  about(); toast('Saved ✓');
}

let tLeft = 0, tRunning = false;
function drawClock(){ const m = Math.floor(tLeft/60), s = tLeft%60; const c = $('#clock'); if (c) c.textContent = `${m}:${String(s).padStart(2,'0')}`; }
function toggleTimer(mins){
  const b = $('#tbtn');
  if (tRunning){ clearInterval(timerInt); tRunning = false; b.textContent = 'Resume'; return; }
  if (!tLeft) tLeft = mins*60;
  tRunning = true; b.textContent = 'Pause';
  timerInt = setInterval(() => { tLeft--; drawClock(); if (tLeft <= 0){ clearInterval(timerInt); tRunning=false; b.textContent='Start'; toast('Time\u2019s up – well done 🌿'); if (navigator.vibrate) navigator.vibrate([200,100,200]); } }, 1000);
}
function resetTimer(mins){ clearInterval(timerInt); tRunning=false; tLeft = mins*60; drawClock(); const b=$('#tbtn'); if(b) b.textContent='Start'; tLeft = 0; const c=$('#clock'); if(c) c.textContent=`${mins}:00`; }

function toggleBreath(){
  const el = $('#breath'), b = $('#breathbtn');
  if (breathInt){ clearInterval(breathInt); breathInt=null; el.classList.remove('in'); el.textContent='Ready'; if(b) b.textContent='Start breathing guide'; return; }
  let inhale = true;
  const tick = () => { el.classList.toggle('in', inhale); el.textContent = inhale ? 'Breathe in… 1-5' : 'Breathe out… 1-5'; inhale = !inhale; };
  tick(); breathInt = setInterval(tick, 5000); if(b) b.textContent='Stop';
}

let lastSuggest = null;
function suggestFrom(cat){
  const pool = EX.filter(e => cat==='any' || e.cats.includes(cat));
  let pick; do { pick = pool[Math.floor(Math.random()*pool.length)]; } while (pool.length > 1 && pick.id === lastSuggest);
  lastSuggest = pick.id;
  history.replaceState(null, '', `#/try/${cat}/${pick.id}`);
  stopTimers(); tLeft = 0; tRunning = false;
  exercise(pick.id, cat); window.scrollTo(0,0);
}

  <p>Take a moment. Have some water, and rest if you need to.</p>

  <button class="btn ghost" style="margin-top:10px" onclick="location.hash='#/'">Not now</button></div>`;
}

// ---------- tracker ----------
function quickLog(type){
  const l = logs(); const entry = {id: Date.now().toString(36), ts: Date.now(), type};
  l.unshift(entry); LS.set('log', l);
  if (navigator.vibrate) navigator.vibrate(60);
  toast(`${TYPES[type].label} logged ✓`);
  location.hash = '#/log/edit/' + entry.id;
}
function logView(){
  header('Symptom log'); setTab('t-log');
  const l = logs();
  app.innerHTML = `
  <div class="private">🔒 Your log is stored only on this phone. Nothing is uploaded.</div>
  <h2>Quick log</h2>
  <div class="row"><button class="btn" onclick="quickLog('tremor')">〰️ Tremor</button><button class="btn" onclick="quickLog('seizure')">🛟 Seizure</button></div>
  <button class="btn alt" style="margin-top:10px" onclick="quickLog('warning')">🌤️ Warning only (no seizure)</button>
  <p class="muted small">One tap saves it with the time. Details are optional.</p>
  <div class="card"><h3 style="margin-top:0">Last 8 weeks</h3>${weekly(l)}</div>
  <div class="card"><h3 style="margin-top:0">Share with your doctor</h3>
    <button class="btn alt" onclick="shareText()">📤 Share / copy summary</button>
    <button class="btn ghost" style="margin-top:10px" onclick="downloadCSV()">⬇️ Download CSV</button></div>
  <h2>History</h2>
  ${l.length ? l.map(e => `<div class="log-item"><span style="font-size:24px">${TYPES[e.type]?.icon||'•'}</span><div class="t"><b>${TYPES[e.type]?.label||e.type}</b><br><span class="muted small">${fmtDate(e.ts)}${e.sev?` · severity ${e.sev}/5`:''}${e.dur?` · ${esc(e.dur)}`:''}${e.trig?` · ${esc(e.trig)}`:''}</span>${e.note?`<br><span class="small">${esc(e.note)}</span>`:''}</div><button class="fav" aria-label="Edit" onclick="location.hash='#/log/edit/${e.id}'">✏️</button></div>`).join('') : '<p class="muted">Nothing logged yet.</p>'}`;
}
function weekStart(ts){ const d = new Date(ts); d.setHours(0,0,0,0); const day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.getTime(); }
function weekly(l){
  const now = weekStart(Date.now()), W = 7*864e5, weeks = [];
  for (let i=7;i>=0;i--){ const s = now - i*W; weeks.push({s, tr:0, sz:0, wa:0}); }
  l.forEach(e => { const w = weeks.find(w => e.ts >= w.s && e.ts < w.s + W + 36e5*2); if (w){ if(e.type==='tremor')w.tr++; else if(e.type==='seizure')w.sz++; else w.wa++; } });
  const max = Math.max(1, ...weeks.map(w => w.tr + w.sz));
  const cur = weeks[weeks.length-1];
  return `<p>This week: <b>${cur.tr}</b> tremor · <b>${cur.sz}</b> seizure · <b>${cur.wa}</b> warning-only</p>
  <div class="bars">${weeks.map(w => `<div class="b"><div style="font-weight:700;color:var(--ink)">${w.tr+w.sz||''}</div><div class="stack" style="height:${(w.tr+w.sz)/max*80}%">${w.sz?`<div class="sz" style="flex:${w.sz}"></div>`:''}${w.tr?`<div class="tr" style="flex:${w.tr}"></div>`:''}</div><div>${new Date(w.s).toLocaleDateString([], {month:'numeric', day:'numeric'})}</div></div>`).join('')}</div>
  <div class="legend"><span><i style="background:var(--brand)"></i>Tremor</span><span><i style="background:var(--warm)"></i>Seizure</span><span>(weeks start Monday)</span></div>`;
}
const DURS = ['< 1 min','1–5 min','5–15 min','15–30 min','30+ min'];
const TRIGS = ['Resting','Stress','Tired','Pain','Crowds','Poor sleep','Upsetting thoughts','Not sure'];
function editLog(id){
  const l = logs(), e = l.find(x => x.id === id); if (!e) return logView();
  header('Add details', true); setTab('t-log');
  app.innerHTML = `<div class="card">
  <p><b>${TYPES[e.type].icon} ${TYPES[e.type].label}</b><br><span class="muted">${fmtDate(e.ts)}</span></p>
  <p class="tip">✓ Saved. Everything below is optional.</p>
  <label>Type</label><div class="seg" id="type">${Object.keys(TYPES).map(k=>`<button data-v="${k}" class="${e.type===k?'on':''}">${TYPES[k].icon}</button>`).join('')}</div>
  <label>How strong? (1 = mild, 5 = severe)</label><div class="seg" id="sev">${[1,2,3,4,5].map(n=>`<button data-v="${n}" class="${e.sev==n?'on':''}">${n}</button>`).join('')}</div>
  <label>How long?</label><div class="seg" id="dur">${DURS.map(d=>`<button data-v="${d}" class="${e.dur===d?'on':''}" style="font-size:15px">${d}</button>`).join('')}</div>
  <label for="trig">Possible trigger</label><input id="trig" value="${esc(e.trig||'')}" placeholder="e.g. resting, stress">
  <div class="chips">${TRIGS.map(t=>`<button onclick="addTrig('${t}')">${t}</button>`).join('')}</div>
  <label for="helped">What helped?</label><select id="helped"><option value="">—</option><option ${e.helped==='Nothing / didn\u2019t try'?'selected':''}>Nothing / didn\u2019t try</option>${EX.map(x=>`<option ${(e.helped===x.title||(x.old&&e.helped===x.old))?'selected':''}>${esc(x.title)}</option>`).join('')}${e.helped && e.helped!=='Nothing / didn\u2019t try' && !EX.some(x=>x.title===e.helped||x.old===e.helped) ? `<option selected>${esc(e.helped)}</option>` : ''}</select>
  <label for="note">Note</label><textarea id="note" placeholder="Anything you noticed">${esc(e.note||'')}</textarea>
  <button class="btn" style="margin-top:16px" onclick="saveLog('${id}')">Save details</button>
  <button class="btn ghost" style="margin-top:10px;color:var(--danger)" onclick="delLog('${id}')">Delete this entry</button></div>`;
  ['type','sev','dur'].forEach(g => document.querySelectorAll(`#${g} button`).forEach(b => b.onclick = () => { const was = b.classList.contains('on'); document.querySelectorAll(`#${g} button`).forEach(x=>x.classList.remove('on')); if(!was||g==='type') b.classList.add('on'); }));
}
function addTrig(t){ const i = $('#trig'); i.value = i.value ? (i.value.includes(t) ? i.value : i.value + ', ' + t) : t; }
function segVal(g){ const b = document.querySelector(`#${g} button.on`); return b ? b.dataset.v : ''; }
function saveLog(id){
  const l = logs(), e = l.find(x => x.id === id); if (!e) return;
  e.type = segVal('type') || e.type; e.sev = segVal('sev') ? +segVal('sev') : undefined; e.dur = segVal('dur') || undefined;
  e.trig = $('#trig').value.trim() || undefined; e.helped = $('#helped').value || undefined; e.note = $('#note').value.trim() || undefined;
  LS.set('log', l); toast('Saved ✓'); location.hash = '#/log';
}
function delLog(id){ if (!confirm('Delete this entry?')) return; LS.set('log', logs().filter(x => x.id !== id)); toast('Deleted'); location.hash = '#/log'; }
function csv(){
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const rows = [['Date','Time','Type','Severity (1-5)','Duration','Possible trigger','What helped','Note']];
  logs().slice().reverse().forEach(e => { const d = new Date(e.ts); rows.push([d.toLocaleDateString(), d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}), TYPES[e.type]?.label||e.type, e.sev||'', e.dur||'', e.trig||'', e.helped||'', e.note||'']); });
  return rows.map(r => r.map(q).join(',')).join('\n');
}
function summary(){
  const l = logs(); if (!l.length) return 'No entries logged yet.';
  const now = Date.now(), d30 = l.filter(e => now - e.ts < 30*864e5);
  const c = t => d30.filter(e => e.type === t).length;
  let s = `FND Companion – symptom log\nLast 30 days: ${c('tremor')} tremor episodes, ${c('seizure')} seizures, ${c('warning')} warnings without a seizure.\n\n`;
  s += l.map(e => `${fmtDate(e.ts)} – ${TYPES[e.type]?.label||e.type}${e.sev?`, severity ${e.sev}/5`:''}${e.dur?`, ${e.dur}`:''}${e.trig?`, trigger: ${e.trig}`:''}${e.helped?`, helped: ${e.helped}`:''}${e.note?`, note: ${e.note}`:''}`).join('\n');
  return s;
}
async function shareText(){
  const text = summary();
  try {
    const file = new File([csv()], 'fnd-symptom-log.csv', {type:'text/csv'});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({title:'FND symptom log', text, files:[file]}); return; }
    if (navigator.share) { await navigator.share({title:'FND symptom log', text}); return; }
  } catch(err){ if (err && err.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Summary copied – paste it anywhere'); }
  catch(e){ app.insertAdjacentHTML('beforeend', `<label>Copy this:</label><textarea style="min-height:200px">${esc(text)}</textarea>`); }
}
function downloadCSV(){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv()], {type:'text/csv'}));
  a.download = 'fnd-symptom-log-' + new Date().toISOString().slice(0,10) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('CSV downloaded');
}

function saved(){
  header('Saved exercises'); setTab('t-saved');
  const f = favs().map(exById).filter(Boolean);
  app.innerHTML = f.length ? `<p class="muted">Exercises you saved. Tap one to open it.</p>` + f.map(e => `<button class="ex" onclick="location.hash='#/ex/${e.id}'"><span class="t">⭐ ${esc(e.title)}</span>${e.mins?`<span class="pill">${e.mins} min</span>`:''}</button>`).join('')
    : `<div class="card"><p>Nothing saved yet.</p><p class="muted">Tap ☆ on any exercise that helps, and it will appear here.</p></div>`;
}

  <p>Please work with your neurologist or physiotherapist on which exercises suit you.</p>

  <div class="card"><h3 style="margin-top:0">Emergency number</h3>

  </select>
  <div id="ecustomwrap" style="${em.code==='OTHER'?'':'display:none'}"><label for="ecustom">Your emergency number</label><input id="ecustom" type="tel" inputmode="tel" value="${esc(es.custom||'')}" placeholder="e.g. 112"></div>
  <button class="btn" style="margin-top:12px" onclick="saveEmergency()">Save</button></div>
  <div class="card"><h3 style="margin-top:0">Your name</h3>
  <p class="muted small">Optional. Used in the greeting and in the text message to your support person (\u201cHi, it\u2019s [your name]\u2026\u201d). If you leave it blank, the text starts with \u201cHi.\u201d Stored only on this phone.</p>
  <label for="myname">Your name</label><input id="myname" autocomplete="given-name" value="${esc(myName())}" placeholder="e.g. Sam">
  <p class="muted small" style="margin-top:8px">Text message preview: \u201c${esc(smsText())}\u201d</p>
  <button class="btn" style="margin-top:12px" onclick="saveName()">Save</button></div>
  <div class="card"><h3 style="margin-top:0">Support person</h3>
  <p class="muted small">Adds “Text” and “Call” buttons to the grounding screen. Stored only on this phone.</p>
  <label for="cn">Name</label><input id="cn" value="${esc(c.name)}" placeholder="e.g. Mom">

  <button class="btn" style="margin-top:12px" onclick="LS.set('contact',{name:$('#cn').value.trim(),phone:$('#cp').value.trim()});toast('Saved ✓')">Save</button></div>
  <div class="card"><h3 style="margin-top:0">Your privacy</h3><p>Saved exercises, your symptom log, your name, your support contact and your emergency number are kept only in this browser on this phone. Nothing is sent anywhere. Clearing browser data will erase them – export your log now and then.</p> <p><a href="privacy.html">Read the full privacy policy</a></p></div>
  <div class="card"><h3 style="margin-top:0">Add to home screen</h3><p class="small"><b>Android (Chrome):</b> tap ⋮ menu → <i>Install app</i> or <i>Add to Home screen</i>.<br><b>iPhone (Safari):</b> tap Share → <i>Add to Home Screen</i>.</p></div>
  <div class="card"><h3 style="margin-top:0">Sources</h3><div class="src">${Object.values(SRC).map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join('<br>')}</div></div>`;
}

// ---------- router ----------
function route(){
  stopTimers(); tLeft = 0; tRunning = false;
  const p = location.hash.replace(/^#\/?/, '').split('/');
  switch (p[0]){
    case 'cat': category(p[1]); break;
    case 'ex': exercise(p[1]); break;
    case 'try': exercise(p[2], p[1]); break;
    case 'suggest': p[1] ? suggestFrom(p[1]) : suggest(); break;
    case 'sos': sos(); break;
    case 'others': others(); break;
    case 'new': newTo(); break;
    case 'log': p[1]==='edit' ? editLog(p[2]) : logView(); break;
    case 'saved': saved(); break;
    case 'about': about(); break;
    default: home();
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  // When a newer version takes over, reload once so the update shows straight away. Saved data (localStorage) is not touched.
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded){ reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r => r.update()).catch(()=>{});
}
</script>
